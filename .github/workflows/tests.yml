# Every suite in this repo skips rather than fails when its preconditions are
# missing: no ComfyUI on the path, no node, no `npm install` in web/. That is
# the right behaviour for someone who has only cloned the repo, and a trap
# everywhere else — a run with all three missing reports green while testing
# almost nothing.
#
# So this job installs all three and then *asserts that nothing skipped*. A new
# skip has to be added here deliberately, which is the only way a skip stays
# honest.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.6"

      - name: Check out ComfyUI
        run: |
          git clone --depth 1 https://github.com/comfyanonymous/ComfyUI.git "$RUNNER_TEMP/ComfyUI"
          echo "COMFYUI_PATH=$RUNNER_TEMP/ComfyUI" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        # torch comes from the CPU wheel index on its own line: passing that
        # index as --index-url for the whole install replaces PyPI, and pytest
        # is not published there. Then ComfyUI's own requirements, because
        # importing comfy_api.latest pulls in the full core (torchvision,
        # transformers, av, einops, scipy, ...) and the node tests skip
        # without it, which the last step would then report as a failure.
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r "$RUNNER_TEMP/ComfyUI/requirements.txt"
          pip install pytest

      - name: Install web toolchain
        working-directory: web
        run: npm ci || npm install

      - name: Typecheck the frontend
        working-directory: web
        run: npx tsc --noEmit

      - name: Run the suite
        run: python -m pytest tests/ -q -rs --junitxml=results.xml

      - name: Fail if a suite skipped
        # Two kinds of skip are expected and named below. Everything else means
        # a precondition is missing, which is the failure this gate exists for.
        #
        # The CUDA device tests are the honest gap: this runner has no GPU, so
        # they skip here and only ever run on a developer machine that has one.
        # They are allowed by name rather than by a wildcard, so a *new* skip in
        # that file still fails.
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("results.xml").getroot()
          skipped = [
              f'{c.get("classname")}::{c.get("name")}'
              for c in root.iter("testcase")
              if c.find("skipped") is not None
          ]
          expected = {
              "tests.test_audit::test_pointwise_ops_do_not_leak_between_frames[match source]"
          }
          # No GPU on a hosted runner; these cannot run here and must not be
          # silently counted as passing either.
          cuda = [n for n in skipped if n.startswith("tests.test_devices::") and "cuda" in n.lower()]
          expected |= set(cuda)
          print(f"{len(cuda)} CUDA test(s) skipped: no GPU on this runner.")
          unexpected = sorted(set(skipped) - expected)
          if unexpected:
              print("These tests skipped, which in CI means a precondition is missing:")
              for name in unexpected:
                  print("  ", name)
              sys.exit(1)
          print(f"{len(skipped)} expected skip(s), no unexpected ones.")
          PY
