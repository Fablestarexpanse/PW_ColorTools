[project]
name = "pw_colortools"
description = "PW Color Tools - colour nodes for ComfyUI built for artists, illustrators and photographers: a plain-language grade panel, monotonic curves with hue preservation, film grain with tonal response, halation and vignette, palette extraction in OKLab, VAE round-trip colour matching, scopes, and a look system that bakes to .cube. Preview and render are the same pixels."
version = "2.0.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"

# Intentionally empty, and this is worth stating rather than leaving to be
# inferred. The pack imports torch, numpy, Pillow and aiohttp, but all four ship
# with ComfyUI, which is the only environment these nodes run in. Declaring them
# would invite ComfyUI Manager to resolve and reinstall torch against a GPU
# build the user carefully chose, which is a far worse failure than the one an
# empty list risks.
dependencies = []

[project.urls]
Repository = "https://github.com/Fablestarexpanse/PW_ColorTools"

[tool.comfy]
PublisherId = "fablestarexpanse"
DisplayName = "PW Color Tools"
Icon = "https://raw.githubusercontent.com/Fablestarexpanse/PW_ColorTools/main/docs/images/icon.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
# rootdir has an __init__.py (ComfyUI requires it), which confuses pytest's
# package detection. Rootdir-relative importlib mode plus an explicit
# pythonpath keeps `import pw_color` working without treating the repo root
# as an importable package.
addopts = "--import-mode=importlib"
pythonpath = ["."]
consider_namespace_packages = false
